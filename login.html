
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitxEX | Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- DARK & YELLOW THEME VARIABLES --- */
        :root {
            --bg-dark: #0b0e11;
            --bg-card: #181a20;
            --text-light: #eaecef;
            --text-muted: #848e9c;
            --primary-yellow: #f3ba2f;
            --danger-red: #f6465d;
            --success-green: #0ecb81;
            --border-dark: #2b3139;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            position: relative; /* For absolute positioning of back arrow */
        }

        /* --- BACK ARROW --- */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-muted);
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            z-index: 10;
            transition: color 0.2s;
        }
        .back-arrow:hover, .back-arrow:active {
            color: var(--primary-yellow);
        }

        /* --- CONTAINER --- */
        .auth-container {
            padding: 30px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .auth-header h1 {
            font-size: 28px;
            margin: 0;
            color: var(--text-light);
        }
        .auth-header p {
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* --- FORM --- */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border-dark);
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: var(--primary-yellow);
        }
        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 15px 15px 15px 45px;
            font-size: 16px;
            outline: none;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .input-wrapper input::placeholder {
            color: #555;
        }

        /* --- BUTTON --- */
        .auth-btn {
            width: 100%;
            background: var(--primary-yellow);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.2);
        }
        .auth-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* --- LINKS --- */
        .auth-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 14px;
        }
        .auth-links a {
            color: var(--primary-yellow);
            text-decoration: none;
            font-weight: 500;
        }

        /* --- CUSTOM POPUP MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-content {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid var(--border-dark);
        }
        .modal-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--danger-red);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-light);
            margin-bottom: 10px;
        }
        .modal-msg {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-btn {
            background: var(--primary-yellow);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .modal-btn:active {
            transform: scale(0.98);
        }

        /* --- LOADING OVERLAY --- */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 14, 17, 0.9);
            z-index: 3000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(243, 186, 47, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary-yellow);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        .loading-text {
            color: var(--primary-yellow);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <a href="mobile.html" class="back-arrow">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <h1>BitxEX Log in.</h1>
            <p>Log in to trade</p>
        </div>

        <div class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Enter your email">
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>
            </div>

            <button class="auth-btn" type="button" onclick="handleLogin()" id="login-btn">
                Log In
            </button>
            
            <div class="auth-links">
                <a href="register.html">Create Account</a>
                <a href="forgot_password.html">Forgot Password?</a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon"><i class="fas fa-exclamation-circle"></i></div>
            <div class="modal-title" id="modal-title">Error</div>
            <div class="modal-msg" id="modal-msg">Something went wrong.</div>
            <button class="modal-btn" onclick="closeModal()">Okay</button>
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">VERIFYING...</div>
    </div>

    <script>
        // --- 1. POPUP FUNCTIONS ---
        function showModal(title, message, isError = true) {
            const overlay = document.getElementById('custom-modal');
            const content = overlay.querySelector('.modal-content');
            
            // Set Content
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = message;
            
            const icon = document.getElementById('modal-icon');
            if(isError) {
                icon.innerHTML = '<i class="fas fa-times-circle"></i>';
                icon.style.color = '#f6465d'; // Updated to danger-red
            } else {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                icon.style.color = '#0ecb81'; // Updated to success-green
            }

            // Animate In
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.opacity = '1';
                content.style.transform = 'scale(1)';
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('custom-modal');
            const content = overlay.querySelector('.modal-content');
            
            // Animate Out
            overlay.style.opacity = '0';
            content.style.transform = 'scale(0.8)';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
        }

        // --- 2. LOADING FUNCTIONS ---
        function showLoading() {
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }


        // --- 3. LOGIN LOGIC (PRESERVED) ---
        async function handleLogin() {
            // Get Values
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            // Validation
            if(!email || !password) {
                showModal("Missing Info", "Please enter both email and password.");
                return;
            }

            // Show Loading
            showLoading();

            try {
                // Send Request
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                // Hide Loading
                hideLoading();

                if (response.ok) {
                    // --- SUCCESS ---
                    localStorage.setItem('bitx_user_id', data.user.id);
                    localStorage.setItem('bitx_user', JSON.stringify(data.user));

                    if (data.user.isAdmin) {
                        window.location.href = 'admin'; 
                    } else {
                        window.location.href = 'mobile.html'; 
                    }
                } else {
                    // --- FAILURE ---
                    showModal("Login Failed", data.message || "Wrong Email or Password");
                }
            } catch (err) {
                // --- ERROR ---
                hideLoading();
                console.error(err);
                showModal("Connection Error", "Please check your internet connection.");
            }
        }
    </script>

</body>
</html>
