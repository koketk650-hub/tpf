
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitxEX | Register</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- DARK & YELLOW THEME VARIABLES --- */
        :root { 
            --bg-dark: #0b0e11; 
            --bg-card: #181a20; 
            --text-light: #eaecef; 
            --text-muted: #848e9c; 
            --primary-yellow: #f3ba2f; 
            --danger-red: #f6465d; 
            --success-green: #0ecb81; 
            --border-dark: #2b3139;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-light); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            position: relative;
        }

        /* --- BACK ARROW --- */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-muted);
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            z-index: 10;
            transition: color 0.2s;
        }
        .back-arrow:hover, .back-arrow:active {
            color: var(--primary-yellow);
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .title { font-size: 28px; font-weight: 700; margin-bottom: 30px; text-align: center; }
        
        .inp-group { margin-bottom: 20px; }
        .inp { 
            width: 100%; 
            padding: 15px; 
            background: var(--bg-card); 
            border: 1px solid var(--border-dark); 
            border-radius: 8px; 
            color: var(--text-light); 
            font-size: 16px;
            outline: none; 
            box-sizing: border-box; 
            transition: border-color 0.3s; 
        }
        .inp::placeholder { color: #555; }
        .inp:focus { border-color: var(--primary-yellow); }
        
        .code-row { display: flex; gap: 10px; }
        .btn-code { 
            background: var(--bg-card); 
            color: var(--primary-yellow); 
            border: 1px solid var(--primary-yellow); 
            border-radius: 8px; 
            width: 130px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 14px;
            transition: opacity 0.2s, background 0.2s; 
        }
        .btn-code:active { background: rgba(243, 186, 47, 0.1); }
        .btn-code:disabled { background: var(--bg-card); border-color: var(--border-dark); color: var(--text-muted); cursor: not-allowed; }

        /* --- AGREEMENT CHECKBOX --- */
        .agreement-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .agreement-box input[type="checkbox"] {
            accent-color: var(--primary-yellow);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .agreement-box a {
            color: var(--primary-yellow);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary-yellow); 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 5px; 
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.2);
            transition: transform 0.1s; 
        }
        .btn-submit:active { transform: scale(0.98); }
        .link { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); cursor: pointer; }
        .link span { color: var(--primary-yellow); font-weight: 600; }

        /* --- CUSTOM POPUP MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-content {
            background: var(--bg-card); padding: 25px; border-radius: 16px;
            width: 85%; max-width: 320px; text-align: center; border: 1px solid var(--border-dark);
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .modal-icon { font-size: 40px; margin-bottom: 15px; }
        .modal-title { font-size: 18px; font-weight: bold; color: var(--text-light); margin-bottom: 10px; }
        .modal-msg { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .modal-btn {
            background: var(--primary-yellow); color: #000; border: none; padding: 12px 30px;
            border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%;
        }
        .modal-btn:active { transform: scale(0.98); }

        /* --- LOADING OVERLAY --- */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 17, 0.9); z-index: 3000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(243, 186, 47, 0.2);
            border-radius: 50%; border-top-color: var(--primary-yellow);
            animation: spin 1s ease-in-out infinite; margin-bottom: 15px;
        }
        .loading-text { color: var(--primary-yellow); font-size: 14px; font-weight: bold; letter-spacing: 1px; animation: pulse 1.5s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <a href="login.html" class="back-arrow">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="auth-container">
        <div class="title">Create Account</div>

        <div class="inp-group">
            <input type="email" id="reg-email" class="inp" placeholder="Email Address">
        </div>

        <div class="inp-group">
            <div class="code-row">
                <input type="text" id="reg-code" class="inp" placeholder="Verification Code">
                <button class="btn-code" id="btn-get-code" onclick="sendRegCode()">Get Code</button>
            </div>
        </div>

        <div class="inp-group">
            <input type="password" id="reg-pass" class="inp" placeholder="Password">
        </div>

        <div class="agreement-box">
            <input type="checkbox" id="agree-check">
            <label for="agree-check">I have read and agree to the <a href="mobile_agreement.html">User Agreement</a></label>
        </div>

        <button class="btn-submit" onclick="doRegister()">Sign Up</button>
        <div class="link" onclick="window.location.href='login.html'">Already have an account? <span>Login</span></div>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon"></div>
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-msg" id="modal-msg"></div>
            <button class="modal-btn" id="modal-btn">Okay</button>
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">PROCESSING...</div>
    </div>

    <script>
        const API_URL = '/api';

        // --- UI HELPERS ---
        let modalCallback = null;

        function showModal(title, message, isError = true, callback = null) {
            const overlay = document.getElementById('custom-modal');
            const content = overlay.querySelector('.modal-content');
            const icon = document.getElementById('modal-icon');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = message;
            
            if(isError) {
                icon.innerHTML = '<i class="fas fa-times-circle"></i>';
                icon.style.color = 'var(--danger-red)';
            } else {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                icon.style.color = 'var(--success-green)';
            }

            modalCallback = callback;

            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.opacity = '1';
                content.style.transform = 'scale(1)';
            }, 10);
        }

        document.getElementById('modal-btn').onclick = function() {
            const overlay = document.getElementById('custom-modal');
            const content = overlay.querySelector('.modal-content');
            
            overlay.style.opacity = '0';
            content.style.transform = 'scale(0.8)';
            setTimeout(() => {
                overlay.style.display = 'none';
                if(modalCallback) {
                    modalCallback();
                    modalCallback = null;
                }
            }, 300);
        };

        function showLoading() { document.getElementById('loading-overlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

        // --- LOGIC ---

        async function sendRegCode() {
            const email = document.getElementById('reg-email').value;
            if(!email) return showModal("Missing Email", "Please enter your email address first.");

            const btn = document.getElementById('btn-get-code');
            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                const res = await fetch(`${API_URL}/send-code`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, type: 'register' })
                });
                const data = await res.json();
                
                if(res.ok) {
                    showModal("Success", "Verification code sent to your email!", false);
                    startTimer(60);
                } else {
                    showModal("Failed", data.message);
                    btn.disabled = false;
                    btn.innerText = "Get Code";
                }
            } catch(e) { 
                showModal("Error", "Connection failed. Check internet."); 
                btn.disabled = false;
                btn.innerText = "Get Code";
            }
        }

        function startTimer(sec) {
            const btn = document.getElementById('btn-get-code');
            let t = sec;
            const timer = setInterval(() => {
                btn.innerText = `${t}s`;
                t--;
                if(t < 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "Get Code";
                }
            }, 1000);
        }

        async function doRegister() {
            const email = document.getElementById('reg-email').value;
            const code = document.getElementById('reg-code').value;
            const password = document.getElementById('reg-pass').value;
            const agree = document.getElementById('agree-check').checked;

            // 1. Check if agreement is checked
            if(!agree) return showModal("Agreement Required", "Please read and accept the User Agreement to continue.");

            // 2. Check fields
            if(!email || !code || !password) return showModal("Missing Fields", "Please fill in all fields.");

            showLoading();

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password, code })
                });
                const data = await res.json();

                hideLoading();

                if(res.ok) {
                    showModal("Success", "Registration Successful! Logging you in...", false, () => {
                        localStorage.setItem('bitx_user_id', data.userId);
                        window.location.href = 'mobile.html';
                    });
                } else {
                    showModal("Registration Failed", data.message);
                }
            } catch(e) { 
                hideLoading();
                showModal("Error", "Something went wrong. Please try again."); 
            }
        }
    </script>
</body>
</html>
